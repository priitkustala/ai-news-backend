# PostgREST's two secrets, read from the memory volume at start (priitkustala/ai-news#92). The image has no shell,
# and these two parameters must not stand in the container's stored environment, so their file names are here.
db-uri = "@/run/ai-news-secrets/rest-db-uri"
jwt-secret = "@/run/ai-news-secrets/rest-jwt-secret"
