# API gateway of the local Supabase interface (priitkustala/ai-news#40), modelled on
# Supabase's self-hosting gateway (supabase/supabase docker/volumes/api/envoy): one local
# address in front of Supabase Auth (/auth/v1/) and PostgREST (/rest/v1/). A request needs
# the local publishable key or secret key in `apikey`; the key is translated into the
# matching role token (anon or service_role) unless the caller sends a user session.
# The @...@ placeholders are filled by entrypoint.sh from the git-ignored .env.stack-api.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ai_news_api
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        # Method, path without the query, status: no header, key or token is logged.
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)%\" %RESPONSE_CODE%\n"
                        # REQ_WITHOUT_QUERY is an extension operator: declared here, as Envoy requires.
                        formatters:
                          - name: envoy.formatter.req_without_query
                            typed_config:
                              '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
                route_config:
                  name: ai_news_route
                  virtual_hosts:
                    - name: ai_news_host
                      domains: ['*']
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          # The client is served on localhost (any port) in the frontend box.
                          allow_origin_string_match:
                            - safe_regex: { regex: '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$' }
                          allow_methods: 'GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD'
                          allow_headers: 'apikey,authorization,content-type,prefer,range,accept-profile,content-profile,x-client-info,x-supabase-api-version'
                          expose_headers: 'content-range,content-location,x-supabase-api-version'
                          max_age: '3600'
                      routes:
                        - name: auth-v1
                          match: { prefix: /auth/v1/ }
                          route: { cluster: auth, prefix_rewrite: /, timeout: 30s }
                        - name: rest-v1
                          match: { prefix: /rest/v1/ }
                          route: { cluster: rest, prefix_rewrite: /, timeout: 30s }
                        - name: not-found
                          match: { prefix: / }
                          direct_response:
                            status: 404
                            body: { inline_string: '{"message":"no route"}' }
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.lua
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          local PUBLISHABLE_KEY = "@PUBLISHABLE_KEY@"
                          local SECRET_KEY = "@SECRET_KEY@"
                          local ANON_JWT = "@ANON_JWT@"
                          local SERVICE_ROLE_JWT = "@SERVICE_ROLE_JWT@"
                          local PROTECTED = { ["auth-v1"] = true, ["rest-v1"] = true }

                          -- A user session is a bearer token that is not one of the opaque sb_ keys.
                          local function has_session(authorization)
                            return authorization ~= nil
                              and string.sub(authorization, 1, 7) == "Bearer "
                              and string.sub(authorization, 1, 10) ~= "Bearer sb_"
                          end

                          function envoy_on_request(handle)
                            local headers = handle:headers()
                            if not PROTECTED[handle:streamInfo():routeName()] then
                              return
                            end
                            local apikey = headers:get("apikey")
                            local role_jwt = nil
                            if apikey == PUBLISHABLE_KEY then
                              role_jwt = ANON_JWT
                            elseif apikey == SECRET_KEY then
                              role_jwt = SERVICE_ROLE_JWT
                            end
                            if role_jwt == nil then
                              handle:respond({ [":status"] = "401", ["content-type"] = "application/json" },
                                '{"message":"Invalid API key"}')
                              return
                            end
                            headers:replace("apikey", role_jwt)
                            if not has_session(headers:get("authorization")) then
                              headers:replace("authorization", "Bearer " .. role_jwt)
                            end
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: auth
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ai-news-auth, port_value: 9999 }
    - name: rest
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: rest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ai-news-rest, port_value: 3000 }
